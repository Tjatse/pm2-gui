;
; Bootstrap-only config. User preferences live in the local SQLite database
; (see Settings in the web UI) under your OS app data directory.
;
; Home directory of pm2.
;
pm2 = ~/.pm2
;
; Port of Web server and socket agent.
;
port = 8088
;
; A value indicates whether or not run the pm2-gui as damonization.
;
daemonize = false

[log]
;
; Fallback log directory (overridable in Settings).
;
dir = ./logs
prefix = true
date = false
level = info

[agent]
;
; Legacy token auth is deprecated. Use Settings → Authentication instead.
;
;authorization =
; offline = true

[remotes]
;
; the dashboard and web server will use this section to connect remoting socket server
;   server_name = [authorization@]host:port
;
; pm2@171 = AuTh@https://192.168.1.171:9002/sockserv

[web]
;
; Prefer Settings → General for public_host / public_protocol.
; These are only fallbacks if the DB has no value yet.
;
; public_host =
; public_protocol = http
;